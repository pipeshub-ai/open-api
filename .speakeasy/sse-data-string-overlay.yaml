# Keeps `data` on the SSE event schemas a JSON-encoded string for SDK generation.
#
# Upstream pipeshub-ai#3255 typed `data` as `type: object`. In the Go and
# TypeScript SDKs that turns `string` / `*string` into an object / map and
# breaks every caller that reads stream events, so they would have to drop
# their JSON.parse / json.Unmarshal. A fix in source_specs/ (4c212cb) is lost
# on the next upstream sync, which rebuilds those files; an overlay in
# .speakeasy/ is not, and `speakeasy run` applies it to every generation.
# It only touches `data`, and applying it to a spec that already has
# `type: string` changes nothing, so it can stay until upstream is fixed.
overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Keep SSE event data a JSON string
  version: 0.0.1
actions:
  - target: $["components"]["schemas"]["UploadStreamSSEEvent"]["properties"]["data"]["type"]
    update: string
  - target: $["components"]["schemas"]["UploadStreamSSEEvent"]["properties"]["data"]["additionalProperties"]
    remove: true
  - target: $["components"]["schemas"]["UploadStreamSSEEvent"]["properties"]["data"]["description"]
    update: JSON-encoded event payload. Decode it to read the fields; the shape depends on `event`.
  - target: $["components"]["schemas"]["AgentRegenerateSSEEvent"]["properties"]["data"]["type"]
    update: string
  - target: $["components"]["schemas"]["AgentRegenerateSSEEvent"]["properties"]["data"]["additionalProperties"]
    remove: true
  - target: $["components"]["schemas"]["AgentRegenerateSSEEvent"]["properties"]["data"]["description"]
    update: JSON-encoded event payload. Decode it to read the fields; the shape depends on `event`.
  - target: $["components"]["schemas"]["SSEEvent"]["properties"]["data"]["type"]
    update: string
  - target: $["components"]["schemas"]["SSEEvent"]["properties"]["data"]["additionalProperties"]
