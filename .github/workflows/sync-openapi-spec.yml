name: Sync OpenAPI Spec from upstream

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-spec:
    name: Sync OpenAPI spec from pipeshub-ai
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch all history so we can switch branches easily
          fetch-depth: 0

      - name: Resolve latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Releases are published by hand, and GitHub's "latest" follows the
          # flags on each release: a beta without the pre-release flag (as
          # v0.6.0-beta was) or a back-port would become "latest". Take the
          # highest stable vX.Y.Z among the published releases instead.
          releases="$(gh api --paginate "repos/pipeshub-ai/pipeshub-ai/releases?per_page=100" \
            --jq '.[] | select((.draft or .prerelease) | not) | .tag_name')"
          tag="$(printf '%s\n' "$releases" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "$tag" ]; then
            echo "::error::Could not resolve a stable pipeshub-ai release tag"
            exit 1
          fi
          echo "Resolved pipeshub-ai release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream spec
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/pipeshub-ai/pipeshub-ai/refs/tags/${RELEASE_TAG}/backend/nodejs/apps/src/modules/api-docs/pipeshub-openapi.yaml" \
            -o /tmp/upstream-openapi.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Filter spec for SDK generation
        run: |
          python scripts/filter_sdk_spec.py \
            /tmp/upstream-openapi.yaml /tmp/processed-openapi.yaml

      - name: Check for differences
        id: diff
        run: |
          changed=false
          if ! diff -q source_specs/pipeshub-openapi.yaml /tmp/upstream-openapi.yaml > /dev/null 2>&1; then
            changed=true
          fi
          if ! diff -q source_specs/pipeshub-sdk-openapi.yaml /tmp/processed-openapi.yaml > /dev/null 2>&1; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Create/Switch to the sync branch
          git checkout -B auto/sync-openapi-spec
          
          # 2. Sync both specs: full reference + filtered SDK spec
          cp /tmp/upstream-openapi.yaml source_specs/pipeshub-openapi.yaml
          cp /tmp/processed-openapi.yaml source_specs/pipeshub-sdk-openapi.yaml

          # 3. Commit
          git add source_specs/pipeshub-openapi.yaml source_specs/pipeshub-sdk-openapi.yaml
          git commit -m "chore: sync OpenAPI spec from upstream pipeshub-ai ${RELEASE_TAG}" || echo "No changes to commit"
          
          # 4. Use --force to overwrite the stale remote branch
          # In a sync bot context, --force is safer than --force-with-lease 
          # because we expect to overwrite the automated branch anyway.
          git push origin auto/sync-openapi-spec --force

      - name: Create or Update Pull Request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          title="chore: sync OpenAPI spec from upstream ${RELEASE_TAG}"
          body="This PR was automatically created to sync the OpenAPI spec from the pipeshub-ai release [${RELEASE_TAG}](https://github.com/pipeshub-ai/pipeshub-ai/releases/tag/${RELEASE_TAG})."

          # If the PR already exists, keep its title and body on the current release
          gh pr create \
            --base main \
            --head auto/sync-openapi-spec \
            --title "$title" \
            --body "$body" \
            || gh pr edit auto/sync-openapi-spec --title "$title" --body "$body"

      - name: Summary
        if: always()
        run: |
          echo "### OpenAPI Spec Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream release: \`${{ steps.release.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.diff.outputs.changed }}" == "true" ]; then
            echo "✅ Upstream changes detected and pushed to branch." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✨ No changes detected." >> "$GITHUB_STEP_SUMMARY"
          fi
