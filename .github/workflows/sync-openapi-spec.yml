name: Sync OpenAPI Spec from upstream

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "pipeshub-ai spec to sync from"
        type: choice
        options:
          - latest-release
          - main
        default: latest-release

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-spec:
    name: Sync OpenAPI spec from pipeshub-ai
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch all history so we can switch branches easily
          fetch-depth: 0

      - name: Resolve upstream ref
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scheduled runs have no inputs, so they always take the release.
          SOURCE: ${{ inputs.source || 'latest-release' }}
        run: |
          if [ "$SOURCE" = "main" ]; then
            # Pin the commit, so the PR says exactly which spec it carries.
            sha="$(gh api repos/pipeshub-ai/pipeshub-ai/commits/main --jq .sha)"
            echo "Resolved pipeshub-ai main: $sha"
            echo "ref=$sha" >> "$GITHUB_OUTPUT"
            echo "tag=main@${sha:0:9}" >> "$GITHUB_OUTPUT"
            echo "url=https://github.com/pipeshub-ai/pipeshub-ai/commit/$sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Releases are published by hand, and GitHub's "latest" follows the
          # flags on each release: a beta without the pre-release flag (as
          # v0.6.0-beta was) or a back-port would become "latest". Take the
          # highest stable vX.Y.Z among the published releases instead.
          releases="$(gh api --paginate "repos/pipeshub-ai/pipeshub-ai/releases?per_page=100" \
            --jq '.[] | select((.draft or .prerelease) | not) | .tag_name')"
          tag="$(printf '%s\n' "$releases" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "$tag" ]; then
            echo "::error::Could not resolve a stable pipeshub-ai release tag"
            exit 1
          fi
          echo "Resolved pipeshub-ai release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/pipeshub-ai/pipeshub-ai/releases/tag/$tag" >> "$GITHUB_OUTPUT"

          # A spec synced from main must not be rolled back to an older release.
          # Skip until a release contains the main commit it came from.
          last="$(git log -1 --format=%s --grep='sync OpenAPI spec from upstream' -- source_specs/pipeshub-openapi.yaml)"
          synced="$(printf '%s\n' "$last" | grep -oE 'main@[0-9a-f]{9}' | cut -d@ -f2 || true)"
          if [ -n "$synced" ]; then
            status="$(gh api "repos/pipeshub-ai/pipeshub-ai/compare/${synced}...${tag}" --jq .status)"
            if [ "$status" != "ahead" ] && [ "$status" != "identical" ]; then
              echo "::notice::Spec was synced from pipeshub-ai main@${synced}, which $tag does not contain; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Fetch upstream spec
        env:
          UPSTREAM_REF: ${{ steps.release.outputs.ref }}
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/pipeshub-ai/pipeshub-ai/${UPSTREAM_REF}/backend/nodejs/apps/src/modules/api-docs/pipeshub-openapi.yaml" \
            -o /tmp/upstream-openapi.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Filter spec for SDK generation
        run: |
          python scripts/filter_sdk_spec.py \
            /tmp/upstream-openapi.yaml /tmp/processed-openapi.yaml

      - name: Check for differences
        id: diff
        run: |
          changed=false
          if [ "${{ steps.release.outputs.skip }}" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! diff -q source_specs/pipeshub-openapi.yaml /tmp/upstream-openapi.yaml > /dev/null 2>&1; then
            changed=true
          fi
          if ! diff -q source_specs/pipeshub-sdk-openapi.yaml /tmp/processed-openapi.yaml > /dev/null 2>&1; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Create/Switch to the sync branch
          git checkout -B auto/sync-openapi-spec
          
          # 2. Sync both specs: full reference + filtered SDK spec
          cp /tmp/upstream-openapi.yaml source_specs/pipeshub-openapi.yaml
          cp /tmp/processed-openapi.yaml source_specs/pipeshub-sdk-openapi.yaml

          # 3. Commit
          git add source_specs/pipeshub-openapi.yaml source_specs/pipeshub-sdk-openapi.yaml
          git commit -m "chore: sync OpenAPI spec from upstream pipeshub-ai ${RELEASE_TAG}" || echo "No changes to commit"
          
          # 4. Use --force to overwrite the stale remote branch
          # In a sync bot context, --force is safer than --force-with-lease 
          # because we expect to overwrite the automated branch anyway.
          git push origin auto/sync-openapi-spec --force

      - name: Create or Update Pull Request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          UPSTREAM_URL: ${{ steps.release.outputs.url }}
        run: |
          title="chore: sync OpenAPI spec from upstream ${RELEASE_TAG}"
          body="This PR was automatically created to sync the OpenAPI spec from pipeshub-ai [${RELEASE_TAG}](${UPSTREAM_URL})."

          # If the PR already exists, keep its title and body on the current release
          gh pr create \
            --base main \
            --head auto/sync-openapi-spec \
            --title "$title" \
            --body "$body" \
            || gh pr edit auto/sync-openapi-spec --title "$title" --body "$body"

      - name: Summary
        if: always()
        run: |
          echo "### OpenAPI Spec Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream: \`${{ steps.release.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.release.outputs.skip }}" == "true" ]; then
            echo "⏭️ Skipped: the current spec came from a newer pipeshub-ai main commit." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.diff.outputs.changed }}" == "true" ]; then
            echo "✅ Upstream changes detected and pushed to branch." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✨ No changes detected." >> "$GITHUB_STEP_SUMMARY"
          fi
